@if (currentUrl() === '/') {
  <main class="dashboard-launcher">
    <section class="dashboard-launcher-content" aria-labelledby="dashboard-launcher-title">
      <span class="dashboard-launcher-eyebrow">DMI FINANCE</span>
      <h1 id="dashboard-launcher-title">Choose a dashboard</h1>
      <p class="dashboard-launcher-description">Select a workspace to continue.</p>

      <nav class="dashboard-link-list" aria-label="Dashboard pages">
        <a class="dashboard-link-card" routerLink="/loan-application-dashboard">
          <span class="dashboard-link-number" aria-hidden="true">01</span>
          <span class="dashboard-link-copy">
            <strong>1 - Loan Application Dashboard</strong>
            <small>Open loan Application dashboard workspace</small>
          </span>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>

        <a class="dashboard-link-card dashboard-link-card-primary" routerLink="/figma-loan-dashboard">
          <span class="dashboard-link-number" aria-hidden="true">02</span>
          <span class="dashboard-link-copy">
            <strong>2 - Figma Loan Dashboard</strong>
            <small>View figma design dashboard</small>
          </span>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>

        <a class="dashboard-link-card" routerLink="/verify-kyc">
          <span class="dashboard-link-number" aria-hidden="true">03</span>
          <span class="dashboard-link-copy">
            <strong>3 - Verify KYC</strong>
            <small>Open the KYC verification workspace</small>
          </span>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
      </nav>
    </section>
  </main>
}
<router-outlet />
